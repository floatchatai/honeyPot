version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: empmonitor_db
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: REDACTED
      POSTGRES_DB: employee_monitor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  backend:
    build: ./backend
    container_name: empmonitor_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: REDACTED
      SECRET_KEY: REDACTED
      CORS_ORIGINS: "*"
    volumes:
      - screenshots_data:/app/screenshots
    restart: unless-stopped
  frontend:
    build: ./frontend
    container_name: empmonitor_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
volumes:
  postgres_data:
  screenshots_data:
